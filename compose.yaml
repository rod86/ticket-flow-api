# yaml-language-server: $schema=vendor/phpro/grumphp-shim/grumphp.phar/vendor/symfony/dependency-injection/Loader/schema/services.schema.json
services:
    api:
        container_name: ticket-flow-api.api
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: setup
        volumes:
            - ./:/app
        environment:
            APP_ENV: ${APP_ENV:-dev}
            SERVER_NAME: ${SERVER_NAME:-localhost}
        ports:
            - "8080:80"
        networks:
            - local
        extra_hosts:
            - "host.docker.internal:host-gateway"

    postgres:
        image: postgres:18.4-alpine
        container_name: ticket-flow-api.postgres
        restart: no
        ports:
            - '${DATABASE_PORT:-5432}:5432'
        environment:
            POSTGRES_USER: '${DATABASE_USER}'
            POSTGRES_PASSWORD: '${DATABASE_PASSWORD}'
            POSTGRES_DB: '${DATABASE_DB}'
        volumes:
            - pgdata:/var/lib/postgresql:rw
        networks:
            - local

volumes:
    pgdata:

networks:
    local: