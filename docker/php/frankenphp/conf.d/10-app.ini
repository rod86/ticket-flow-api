[PHP]
date.timezone=UTC
apc.enable_cli=1
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
realpath_cache_ttl=0

; missing, harmless in dev, avoids surprises when memory_limit differs
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; xdebug is installed — make sure it's actually gated, not always-on
xdebug.mode=off