[PHP]
date.timezone=UTC
apc.enable_cli=1
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
realpath_cache_ttl=0

; missing, harmless in dev, avoids surprises when memory_limit differs
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; xdebug is installed — make sure it's actually gated, not always-on
xdebug.mode=develop,debug,coverage
; Plain Docker Engine on WSL2 (no Docker Desktop) rewrites the source IP of
; port-forwarded connections to the compose network's own bridge gateway, so
; REMOTE_ADDR-based discovery always finds the wrong host. PhpStorm runs on
; Windows, reachable only via WSL2's gateway to the host, which changes across
; WSL restarts — left unset here so the XDEBUG_CONFIG env var (computed fresh
; by `make up`, see compose.yaml/Makefile) can supply it at runtime.
xdebug.discover_client_host=0
xdebug.client_port=9003
xdebug.idekey=PHPSTORM
xdebug.start_with_request=yes
