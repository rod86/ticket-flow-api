# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters: {}

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            bool $debug: '%kernel.debug%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/UI/Http/Request'

    App\UI\Http\Controller\:
        resource: '../src/UI/Http/Controller/'
        tags: ['controller.service_arguments']

    App\UI\Http\EventListener\ApiExceptionListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception }

    App\Shared\Infrastructure\Bus\MessengerCommandBus:
        arguments:
            $messageBus: '@command.bus'

    App\Shared\Infrastructure\Bus\MessengerQueryBus:
        arguments:
            $messageBus: '@query.bus'

    _instanceof:
        App\Shared\Application\Bus\QueryHandlerInterface:
            tags: [{ name: messenger.message_handler, bus: query.bus }]
        App\Shared\Application\Bus\CommandHandlerInterface:
            tags: [{ name: messenger.message_handler, bus: command.bus }]

when@test:
    services:
        App\Tickets\Infrastructure\Persistence\Doctrine\DoctrineTicketRepository:
            autowire: true
            public: true
