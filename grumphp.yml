grumphp:
    ascii:
        failed: .grumphp/failed.txt
        succeeded: .grumphp/success.txt
    tasks:
        phpstan:
            scripts:
                - .grumphp/phpstan-staged.sh
            triggered_by: [ php ]
            metadata:
                task: shell
                label: phpstan (docker, staged files)
        shell:
            scripts:
                - .grumphp/phpcs-staged.sh
            triggered_by: [ php ]
            metadata:
                label: phpcs (docker, staged files)
